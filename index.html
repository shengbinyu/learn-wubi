<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>字根工坊 · 五笔活字沙盒</title>
  <meta name="description" content="一个离线可玩的五笔 86 学习沙盒：认字根、拆字、拓印成字。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%23a83226'/%3E%3Ctext x='32' y='45' font-size='38' text-anchor='middle' fill='%23f2e8d5' font-family='KaiTi,serif'%3E五%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/screens.css">
  <link rel="stylesheet" href="css/motion.css">
</head>
<body>
  <a class="skip-link" href="#screen">跳到主内容</a>

  <div id="app" class="app">
    <header class="topbar">
      <a class="brand" href="#/" aria-label="字根工坊首页">
        <span class="brand-seal" aria-hidden="true">五</span>
        <span class="brand-text">
          <strong>字根工坊</strong>
          <small>五笔 · 活字沙盒</small>
        </span>
      </a>
      <div class="topbar-stats">
        <span class="stat-chip" id="xpChip" title="工坊经验">
          <span class="stat-label">铜钱</span><b id="xpValue">0</b>
        </span>
        <span class="stat-chip" id="streakChip" title="连续开坊">
          <span class="stat-label">连火</span><b id="streakValue">0</b>
        </span>
        <button class="icon-btn" id="settingsBtn" type="button" aria-label="设置" title="设置">
          <span aria-hidden="true">⚙</span>
        </button>
      </div>
    </header>

    <div class="shell">
      <nav class="side-nav" id="sideNav" aria-label="主导航">
        <a class="nav-slip" data-nav="home" href="#/"><span class="nav-seal">坊</span><span>工坊</span></a>
        <a class="nav-slip" data-nav="sandbox" href="#/sandbox"><span class="nav-seal">沙</span><span>沙盒</span></a>
        <a class="nav-slip" data-nav="campaign" href="#/campaign"><span class="nav-seal">卷</span><span>卷轴</span></a>
        <a class="nav-slip" data-nav="review" href="#/review"><span class="nav-seal">复</span><span>复习</span></a>
        <a class="nav-slip" data-nav="lookup" href="#/lookup"><span class="nav-seal">码</span><span>查码</span></a>
        <a class="nav-slip" data-nav="stats" href="#/stats"><span class="nav-seal">统</span><span>统计</span></a>
      </nav>

      <main id="screen" class="screen" tabindex="-1" aria-live="polite"></main>

      <aside id="aside" class="side-tools" aria-label="工具架"></aside>
    </div>

    <footer class="footer">
      <span>五笔 86 · 字根工坊</span>
      <span class="footer-note">离线单机 · 进度存于本机</span>
    </footer>
  </div>

  <div class="toast-layer" id="toastLayer" role="status" aria-live="polite"></div>
  <div class="overlay-layer" id="overlayLayer" hidden></div>

  <div class="boot" id="boot">
    <div class="boot-inner">
      <div class="boot-seal" aria-hidden="true">五</div>
      <p class="boot-title">字根工坊</p>
      <p class="boot-sub">正在拓印第一张纸……</p>
    </div>
  </div>

  <noscript><div class="noscript">这个游戏需要 JavaScript 才能开坊。</div></noscript>

  <script src="data/wubi86-chars.js"></script>
  <script src="data/wubi86-words.js"></script>
  <script src="data/hanzi-strokes.js"></script>
  <script src="js/data/roots.js"></script>
  <script src="js/data/lessons.js"></script>
  <script src="js/data/decompositions.js"></script>
  <script src="js/data/passages.js"></script>
  <script src="js/core/util.js"></script>
  <script src="js/core/dict.js"></script>
  <script src="js/core/levels.js"></script>
  <script src="js/core/progress.js"></script>
  <script src="js/core/engine.js"></script>
  <script src="js/core/audio.js"></script>
  <script src="js/ui/common.js"></script>
  <script src="js/ui/keyboard.js"></script>
  <script src="js/ui/charCard.js"></script>
  <script src="js/ui/dashboard.js"></script>
  <script src="js/ui/sandbox.js"></script>
  <script src="js/ui/campaign.js"></script>
  <script src="js/ui/play.js"></script>
  <script src="js/ui/review.js"></script>
  <script src="js/ui/lookup.js"></script>
  <script src="js/ui/stats.js"></script>
  <script src="js/ui/settings.js"></script>
  <script src="js/ui/onboarding.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
